---
argument_specs:
  main:
    short_description: 'Deploys ZITADEL as a Quadlet-managed container backed by PostgreSQL.'
    options:
      zitadel_base_dir:
        type: 'str'
        default: '/opt/containers/zitadel'
        description: 'Base host directory for ZITADEL configuration and runtime data.'

      zitadel_config_dir:
        type: 'str'
        default: '/opt/containers/zitadel/config'
        description: 'Host directory for rendered ZITADEL configuration files.'

      zitadel_data_dir:
        type: 'str'
        default: '/opt/containers/zitadel/data'
        description: 'Host directory for ZITADEL runtime data shared with containers.'

      zitadel_state_dir:
        type: 'str'
        default: '/opt/containers/zitadel/state'
        description: 'Host directory used for Ansible-managed init and setup marker files.'

      zitadel_quadlet_unit_dir:
        type: 'str'
        default: '/etc/containers/systemd'
        description: 'Podman Quadlet unit directory prepared by the podman role.'

      zitadel_init_marker_file:
        type: 'str'
        default: '/opt/containers/zitadel/state/init.done'
        description: 'Marker file written after the ZITADEL init phase completes successfully.'

      zitadel_setup_revision:
        type: 'str'
        description: 'Revision token used to decide whether setup must run again. Defaults to the full ZITADEL image reference.'

      zitadel_setup_marker_file:
        type: 'str'
        description: 'Marker file written after the ZITADEL setup phase completes successfully for the current revision.'

      zitadel_container_user:
        type: 'str'
        default: '80'
        description: 'UID used for ZITADEL containers and owned host files.'

      zitadel_container_group:
        type: 'str'
        default: '80'
        description: 'GID used for ZITADEL containers and owned host files.'

      zitadel_config_dir_mode:
        type: 'str'
        default: '0755'
        description: 'Default mode for ZITADEL configuration directories.'

      zitadel_config_file_mode:
        type: 'str'
        default: '0600'
        description: 'Mode for rendered ZITADEL configuration and marker files.'

      zitadel_data_dir_mode:
        type: 'str'
        default: '0755'
        description: 'Mode for the ZITADEL data directory.'

      zitadel_state_dir_mode:
        type: 'str'
        default: '0755'
        description: 'Mode for the ZITADEL state directory.'

      zitadel_image_repo:
        type: 'str'
        default: 'ghcr.io/zitadel/zitadel'
        description: 'Container image repository used for ZITADEL.'

      zitadel_image_ref:
        type: 'str'
        default: 'stable'
        description: 'Container image version used for ZITADEL.'

      zitadel_memory:
        type: 'str'
        description: 'Optional Podman memory limit rendered as Quadlet Container Memory= for the ZITADEL service.'

      zitadel_service_name:
        type: 'str'
        default: 'zitadel'
        description: 'Quadlet and systemd service name for the ZITADEL container.'

      zitadel_service_dependencies:
        type: 'list'
        elements: 'str'
        default: []
        description: 'Optional systemd unit dependencies rendered as both Requires= and After= in the ZITADEL container unit.'

      zitadel_networks:
        type: 'list'
        elements: 'str'
        default: []
        description: 'Existing Podman networks attached to the ZITADEL containers.'

      zitadel_network_aliases:
        type: 'list'
        elements: 'str'
        default:
          - 'zitadel'
        description: 'Optional network aliases applied across all ZITADEL service network attachments.'

      zitadel_state:
        type: 'str'
        default: 'restarted'
        description: 'Desired systemd service state for the ZITADEL workload.'
        choices:
          - 'reloaded'
          - 'restarted'
          - 'started'
          - 'stopped'

      zitadel_enable:
        type: 'bool'
        default: true
        description: 'Whether the ZITADEL systemd service should be enabled.'

      zitadel_restart:
        type: 'str'
        default: 'on-failure'
        description: 'Restart policy passed through to the ZITADEL Quadlet unit.'

      zitadel_timeout_start:
        type: 'str'
        default: '120s'
        description: 'Systemd start timeout used by the ZITADEL service.'

      zitadel_timeout_stop:
        type: 'str'
        default: '30s'
        description: 'Systemd stop timeout used by the ZITADEL service.'

      zitadel_init_timeout:
        type: 'int'
        default: 300
        description: 'Timeout in seconds for the synchronous ZITADEL init phase.'

      zitadel_setup_timeout:
        type: 'int'
        default: 600
        description: 'Timeout in seconds for the synchronous ZITADEL setup phase.'

      zitadel_setup_init_projections:
        type: 'bool'
        default: true
        description: 'Whether the ZITADEL setup phase should initialize projections before runtime starts.'

      zitadel_log_level:
        type: 'str'
        default: 'info'
        description: 'ZITADEL log level written to the public runtime configuration.'

      zitadel_listen_port:
        type: 'int'
        default: 8080
        description: 'Port ZITADEL listens on inside the container.'

      zitadel_external_domain:
        type: 'str'
        default: ''
        description: 'Public external domain clients use to reach ZITADEL.'

      zitadel_external_port:
        type: 'int'
        default: 443
        description: 'Public port advertised by ZITADEL.'

      zitadel_external_secure:
        type: 'bool'
        default: true
        description: 'Whether ZITADEL should advertise HTTPS externally.'

      zitadel_tls_enabled:
        type: 'bool'
        default: false
        description: 'Whether ZITADEL itself terminates TLS.'

      zitadel_tls_mode:
        type: 'str'
        default: 'external'
        description: 'TLS mode passed to the ZITADEL CLI.'

      zitadel_database_host:
        type: 'str'
        default: 'postgres'
        description: 'PostgreSQL host used by ZITADEL.'

      zitadel_database_port:
        type: 'int'
        default: 5432
        description: 'PostgreSQL port used by ZITADEL.'

      zitadel_database_name:
        type: 'str'
        default: 'zitadel'
        description: 'PostgreSQL database name used by ZITADEL.'

      zitadel_database_ssl_mode:
        type: 'str'
        default: 'disable'
        description: 'SSL mode used for ZITADEL PostgreSQL connections.'

      zitadel_database_admin_existing_database:
        type: 'str'
        default: ''
        description: 'Optional existing database used by the admin connection when database/user provisioning is skipped.'

      zitadel_database_user_username:
        type: 'str'
        default: 'zitadel'
        description: 'PostgreSQL application user used by ZITADEL.'

      zitadel_database_user_password:
        type: 'str'
        default: ''
        description: 'Password for the PostgreSQL application user used by ZITADEL.'

      zitadel_database_admin_username:
        type: 'str'
        default: 'postgres'
        description: 'PostgreSQL admin user used during ZITADEL initialization.'

      zitadel_database_admin_password:
        type: 'str'
        default: ''
        description: 'Password for the PostgreSQL admin user used during ZITADEL initialization.'

      zitadel_firstinstance_org_human_username:
        type: 'str'
        default: 'root'
        description: 'Username for the first human administrator created by ZITADEL.'

      zitadel_firstinstance_org_human_password:
        type: 'str'
        default: ''
        description: 'Password for the first human administrator created by ZITADEL.'

      zitadel_firstinstance_trusted_domains:
        type: 'list'
        elements: 'str'
        default: []
        description: 'Trusted domains configured on the first ZITADEL instance during setup.'

      zitadel_masterkey:
        type: 'str'
        default: ''
        description: '32-byte masterkey used by ZITADEL to encrypt generated keys.'

      zitadel_masterkey_secret_name:
        type: 'str'
        default: 'zitadel-masterkey'
        description: 'Podman secret name used for the ZITADEL masterkey.'

      zitadel_masterkey_secret_target:
        type: 'str'
        default: 'zitadel-masterkey'
        description: 'Filename used when mounting the Podman masterkey secret into the container.'

      zitadel_masterkey_secret_driver:
        type: 'str'
        default: 'file'
        description: 'Podman secret driver used for the ZITADEL masterkey.'

      zitadel_masterkey_secret_container_path:
        type: 'str'
        default: '/run/secrets/zitadel-masterkey'
        description: 'Container path used by ZITADEL to read the mounted masterkey secret.'

      zitadel_public_config_file:
        type: 'str'
        default: '/opt/containers/zitadel/config/config.yaml'
        description: 'Host path for the rendered public ZITADEL configuration.'

      zitadel_init_secret_config_file:
        type: 'str'
        default: '/opt/containers/zitadel/config/init-secrets.yaml'
        description: 'Host path for the rendered init-only ZITADEL secret configuration.'

      zitadel_runtime_secret_config_file:
        type: 'str'
        default: '/opt/containers/zitadel/config/runtime-secrets.yaml'
        description: 'Host path for the rendered runtime ZITADEL secret configuration.'

      zitadel_init_steps_file:
        type: 'str'
        default: '/opt/containers/zitadel/config/init-steps.yaml'
        description: 'Host path for the rendered ZITADEL setup steps configuration.'

      zitadel_login_enabled:
        type: 'bool'
        default: true
        description: 'Whether the self-hosted Login V2 UI should be deployed alongside ZITADEL.'

      zitadel_login_image_repo:
        type: 'str'
        default: 'ghcr.io/zitadel/zitadel-login'
        description: 'Container image repository used for the self-hosted ZITADEL login UI.'

      zitadel_login_image_ref:
        type: 'str'
        default: 'latest'
        description: 'Container image version used for the self-hosted ZITADEL login UI.'

      zitadel_login_memory:
        type: 'str'
        description: 'Optional Podman memory limit rendered as Quadlet Container Memory= for the login UI.'

      zitadel_login_service_name:
        type: 'str'
        default: 'zitadel-login'
        description: 'Quadlet and systemd service name for the ZITADEL login UI container.'

      zitadel_login_networks:
        type: 'list'
        elements: 'str'
        description: 'Existing Podman networks attached to the ZITADEL login UI container. Defaults to zitadel_networks.'

      zitadel_login_network_aliases:
        type: 'list'
        elements: 'str'
        default:
          - 'zitadel-login'
        description: 'Optional network aliases applied across all login UI network attachments.'

      zitadel_login_state:
        type: 'str'
        default: 'restarted'
        description: 'Desired systemd service state for the ZITADEL login UI.'
        choices:
          - 'reloaded'
          - 'restarted'
          - 'started'
          - 'stopped'

      zitadel_login_enable:
        type: 'bool'
        default: true
        description: 'Whether the ZITADEL login UI systemd service should be enabled.'

      zitadel_login_restart:
        type: 'str'
        default: 'on-failure'
        description: 'Restart policy passed through to the ZITADEL login UI Quadlet unit.'

      zitadel_login_timeout_start:
        type: 'str'
        default: '60s'
        description: 'Systemd start timeout used by the ZITADEL login UI service.'

      zitadel_login_timeout_stop:
        type: 'str'
        default: '30s'
        description: 'Systemd stop timeout used by the ZITADEL login UI service.'

      zitadel_login_base_path:
        type: 'str'
        default: '/ui/v2/login'
        description: 'Base path under which the self-hosted Login V2 UI is served.'

      zitadel_login_base_uri:
        type: 'str'
        description: 'External base URI of the self-hosted Login V2 UI used to enable Login V2 on the instance.'

      zitadel_login_api_url:
        type: 'str'
        description: 'Internal API URL the login UI uses to reach the ZITADEL API. Defaults to the internal ZITADEL service URL.'

      zitadel_login_custom_request_headers:
        type: 'str'
        description: 'Custom request headers passed to the login UI. Defaults to forwarding the configured external Host header.'

      zitadel_login_client_pat_container_path:
        type: 'str'
        default: '/var/lib/zitadel/login-client.pat'
        description: 'Shared container path where ZITADEL writes the login-client PAT and the login UI reads it.'

      zitadel_firstinstance_loginclient_machine_username:
        type: 'str'
        default: 'login-client'
        description: 'Username for the machine user created with IAM_LOGIN_CLIENT permissions.'

      zitadel_firstinstance_loginclient_machine_name:
        type: 'str'
        default: 'Automatically Initialized instance Login Client'
        description: 'Display name for the machine user created with IAM_LOGIN_CLIENT permissions.'

      zitadel_firstinstance_loginclient_pat_expiration_date:
        type: 'str'
        default: '2029-01-01T00:00:00Z'
        description: 'Expiration date for the login-client PAT written during first-instance setup.'

  init:
    short_description: 'Runs the synchronous ZITADEL init phase through podman.'
    options:
      zitadel_image_repo:
        type: 'str'
        default: 'ghcr.io/zitadel/zitadel'
        description: 'Container image repository used for ZITADEL.'

      zitadel_image_ref:
        type: 'str'
        default: 'stable'
        description: 'Container image version used for ZITADEL.'

      zitadel_networks:
        type: 'list'
        elements: 'str'
        default: []
        description: 'Existing Podman networks attached to the ephemeral init container.'

      zitadel_init_timeout:
        type: 'int'
        default: 300
        description: 'Timeout in seconds for the synchronous ZITADEL init phase.'

      zitadel_init_marker_file:
        type: 'str'
        description: 'Marker file written after the ZITADEL init phase completes successfully.'

  setup:
    short_description: 'Runs the synchronous ZITADEL setup phase through podman.'
    options:
      zitadel_image_repo:
        type: 'str'
        default: 'ghcr.io/zitadel/zitadel'
        description: 'Container image repository used for ZITADEL.'

      zitadel_image_ref:
        type: 'str'
        default: 'stable'
        description: 'Container image version used for ZITADEL.'

      zitadel_networks:
        type: 'list'
        elements: 'str'
        default: []
        description: 'Existing Podman networks attached to the ephemeral setup container.'

      zitadel_setup_timeout:
        type: 'int'
        default: 600
        description: 'Timeout in seconds for the synchronous ZITADEL setup phase.'

      zitadel_setup_init_projections:
        type: 'bool'
        default: true
        description: 'Whether the ZITADEL setup phase should initialize projections before runtime starts.'

      zitadel_setup_revision:
        type: 'str'
        description: 'Revision token used to decide whether setup must run again.'

      zitadel_setup_marker_file:
        type: 'str'
        description: 'Marker file written after the ZITADEL setup phase completes successfully for the current revision.'
