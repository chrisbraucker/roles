---
- name: 'Render zitadel quadlet unit'
  ansible.builtin.template:
    src: 'zitadel.container.j2'
    dest: '{{ (zitadel_quadlet_unit_dir, zitadel_service_name ~ ".container") | path_join }}'
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: 'zitadel_quadlet_unit'


- name: 'Manage zitadel service'
  ansible.builtin.systemd_service:
    name: '{{ zitadel_service_name }}.service'
    state: '{{ zitadel_state }}'
    enabled: '{{ zitadel_enable }}'
    daemon_reload: '{{ zitadel_quadlet_unit.changed }}'


- name: 'Flush zitadel handlers'
  ansible.builtin.meta: flush_handlers


- name: 'Deploy zitadel login UI'
  ansible.builtin.import_tasks: 'login.yml'
  vars:
    zitadel_skip_prepare: true
  when: 'zitadel_login_enabled | bool'
