---
- name: 'Prepare zitadel runtime assets for login'
  ansible.builtin.import_tasks: 'prepare.yml'
  when: 'not (zitadel_skip_prepare | default(false) | bool)'


- name: 'Render zitadel-login quadlet unit'
  ansible.builtin.template:
    src: 'zitadel-login.container.j2'
    dest: '{{ (zitadel_quadlet_unit_dir, zitadel_login_service_name ~ ".container") | path_join }}'
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: 'zitadel_login_quadlet_unit'


- name: 'Manage zitadel-login service'
  ansible.builtin.systemd_service:
    name: '{{ zitadel_login_service_name }}.service'
    state: '{{ zitadel_login_state }}'
    enabled: '{{ zitadel_login_enable }}'
    daemon_reload: '{{ zitadel_login_quadlet_unit.changed }}'
