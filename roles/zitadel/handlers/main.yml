---
- name: 'Check for rendered zitadel quadlet unit'
  listen: 'Restart zitadel'
  ansible.builtin.stat:
    path: '{{ (zitadel_quadlet_unit_dir, zitadel_service_name ~ ".container") | path_join }}'
  register: 'zitadel_quadlet_unit_stat'


- name: 'Restart zitadel'
  listen: 'Restart zitadel'
  ansible.builtin.systemd_service:
    name: '{{ zitadel_service_name }}.service'
    state: 'restarted'
  when: 'zitadel_quadlet_unit_stat.stat.exists'
