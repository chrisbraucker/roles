---
- name: 'Validate certbot container configuration'
  ansible.builtin.assert:
    that:
      - 'certbot_container_image | length > 0'
      - 'certbot_service_name | length > 0'
    fail_msg: 'certbot_container_image and certbot_service_name must be set.'


- name: 'Ensure certbot base directories exist'
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: 'directory'
    owner: 'root'
    group: 'root'
    mode: '{{ item.mode | default("0755") }}'
  loop:
    - path: '{{ certbot_config_dir }}'
    - path: '{{ certbot_work_dir }}'
    - path: '{{ certbot_logs_dir }}'
  loop_control:
    label: '{{ item.path }}'


- name: 'Configure certbot challenge prerequisites'
  ansible.builtin.include_tasks: '{{ certbot_challenge_type }}.yml'
  when: 'certbot_challenge_type | length > 0'


- name: 'Assemble certbot quadlet volumes'
  ansible.builtin.set_fact:
    certbot_quadlet_volumes: '{{ certbot_default_volumes + certbot_challenge_volumes | default([]) }}'
  vars:
    certbot_default_volumes:
      - '{{ certbot_config_dir }}:/etc/letsencrypt:Z'
      - '{{ certbot_work_dir }}:/var/lib/letsencrypt:Z'
      - '{{ certbot_logs_dir }}:/var/log/letsencrypt:Z'


- name: 'Deploy certbot renewal container through quadlet'
  ansible.builtin.include_role:
    name: 'quadlet'
  vars:
    quadlet_services:
      - name: '{{ certbot_service_name }}'
        description: 'Certbot renewal runner'
        image: '{{ certbot_container_image }}'
        command: 'renew'
        service_type: 'oneshot'
        remain_after_exit: false
        restart: 'no'
        state: 'stopped'
        enable: false
        wanted_by: []
        unit_on_success: '{{ [certbot_service_name ~ "-post.service"] if certbot_reload_service_name | length > 0 else [] }}'
        volumes: '{{ certbot_quadlet_volumes }}'


- name: 'Render certbot post-hook service'
  ansible.builtin.template:
    src: 'certbot-post.service.j2'
    dest: '{{ ("/etc/systemd/system", certbot_service_name ~ "-post.service") | path_join }}'
    owner: 'root'
    group: 'root'
    mode: '0644'
  when: 'certbot_reload_service_name | length > 0'
  notify: 'Reload systemd daemon'


- name: 'Remove certbot post-hook service when reload action is disabled'
  ansible.builtin.file:
    path: '{{ ("/etc/systemd/system", certbot_service_name ~ "-post.service") | path_join }}'
    state: 'absent'
  when: 'certbot_reload_service_name | length == 0'
  notify: 'Reload systemd daemon'


- name: 'Render certbot renewal timer'
  ansible.builtin.template:
    src: 'certbot.timer.j2'
    dest: '{{ ("/etc/systemd/system", certbot_service_name ~ ".timer") | path_join }}'
    owner: 'root'
    group: 'root'
    mode: '0644'
  notify: 'Reload systemd daemon'


- name: 'Flush certbot handlers'
  ansible.builtin.meta: flush_handlers


- name: 'Enable and start certbot renewal timer'
  ansible.builtin.systemd:
    name: '{{ certbot_service_name }}-container.timer'
    state: '{{ "started" if certbot_timer_enabled else "stopped" }}'
    enabled: '{{ certbot_timer_enabled }}'
