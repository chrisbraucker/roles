---
- name: 'Prepare certbot runtime'
  ansible.builtin.import_tasks: 'setup.yml'


- name: 'Deploy certbot renewal container through quadlet'
  ansible.builtin.include_role:
    name: 'quadlet'
  vars:
    quadlet_services:
      - name: '{{ certbot_service_name }}'
        description: 'Certbot renewal runner'
        image: '{{ certbot_image_repo }}:{{ certbot_image_ref }}'
        command: 'renew'
        service_type: 'oneshot'
        remain_after_exit: false
        restart: 'no'
        state: 'stopped'
        enable: false
        wanted_by: []
        unit_on_success: '{{ [certbot_service_name ~ "-post.service"] if certbot_reload_service_name | length > 0 else [] }}'
        volumes: '{{ certbot_container_volumes }}'
        # needed for post-renewal permissions confirmation
        add_capabilities: [ 'CAP_CHOWN' ]


- name: 'Render certbot post-hook service'
  ansible.builtin.template:
    src: 'certbot-post.service.j2'
    dest: '{{ ("/etc/systemd/system", certbot_service_name ~ "-post.service") | path_join }}'
    owner: 'root'
    group: 'root'
    mode: '0644'
  when: 'certbot_reload_service_name | length > 0'
  notify: 'Reload systemd daemon'


- name: 'Ensure certbot post-hook script directory exists'
  ansible.builtin.file:
    path: '/usr/local/libexec'
    state: 'directory'
    owner: 'root'
    group: 'root'
    mode: '0755'
  when: 'certbot_reload_service_name | length > 0'


- name: 'Render certbot post-hook script'
  ansible.builtin.template:
    src: 'certbot-post.sh.j2'
    dest: '{{ ("/usr/local/libexec", certbot_service_name ~ "-post.sh") | path_join }}'
    owner: 'root'
    group: 'root'
    mode: '0755'
  when: 'certbot_reload_service_name | length > 0'


- name: 'Remove certbot post-hook service when reload action is disabled'
  ansible.builtin.file:
    path: '{{ ("/etc/systemd/system", certbot_service_name ~ "-post.service") | path_join }}'
    state: 'absent'
  when: 'certbot_reload_service_name | length == 0'
  notify: 'Reload systemd daemon'


- name: 'Remove certbot post-hook script when reload action is disabled'
  ansible.builtin.file:
    path: '{{ ("/usr/local/libexec", certbot_service_name ~ "-post.sh") | path_join }}'
    state: 'absent'
  when: 'certbot_reload_service_name | length == 0'


- name: 'Render certbot renewal timer'
  ansible.builtin.template:
    src: 'certbot.timer.j2'
    dest: '{{ ("/etc/systemd/system", certbot_service_name ~ ".timer") | path_join }}'
    owner: 'root'
    group: 'root'
    mode: '0644'
  notify: 'Reload systemd daemon'


- name: 'Flush certbot handlers'
  ansible.builtin.meta: flush_handlers


- name: 'Enable and start certbot renewal timer'
  ansible.builtin.systemd_service:
    name: '{{ certbot_service_name }}.timer'
    state: '{{ "started" if certbot_timer_enabled else "stopped" }}'
    enabled: '{{ certbot_timer_enabled }}'
