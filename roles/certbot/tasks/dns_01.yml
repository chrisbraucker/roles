---
- name: 'Validate certbot DNS-01 configuration'
  ansible.builtin.assert:
    that:
      - 'certbot_dns_01_credentials | length > 0'
      - 'certbot_dns_01_args is sequence'
      - 'certbot_dns_01_args is not string'
      - 'certbot_dns_01_args | length > 0'
    fail_msg: >-
      DNS-01 requires certbot_dns_01_credentials from Ansible Vault and a
      non-empty certbot_dns_01_args list.


- name: 'Create Certbot DNS-01 Podman secret'
  containers.podman.podman_secret:
    state: 'present'
    name: 'certbot-dns-credentials'
    data: '{{ certbot_dns_01_credentials }}'
  register: 'certbot_dns_01_secret'
  no_log: true


- name: 'Set certbot DNS-01 challenge facts'
  ansible.builtin.set_fact:
    certbot_challenge_type: 'dns_01'
    certbot_challenge_volumes: []
    certbot_challenge_secrets: ['certbot-dns-credentials']
    certbot_authenticator_args: '{{ certbot_dns_01_args }}'
