---
argument_specs:
  main:
    short_description: 'Deploys containerized certbot renewal through Quadlet and a systemd timer.'
    options:
      certbot_email:
        type: 'str'
        default: ''
        description: 'Contact email to be used for certificate registration later.'

      certbot_server:
        type: 'str'
        default: ''
        description: 'Optional ACME directory URL used for certificate issuance later. When unset, certbot uses its own default server selection.'

      certbot_key_type:
        type: 'str'
        default: 'ecdsa'
        description: 'Default key type to use for future certificate requests.'

      certbot_image_repo:
        type: 'str'
        default: 'docker.io/certbot/certbot'
        description: 'Container image repository used for certbot runs; DNS-01 requires an image that includes the selected provider plugin.'

      certbot_image_ref:
        type: 'str'
        default: 'latest'
        description: 'Container image version used for certbot renewal runs.'

      certbot_challenge_type:
        type: 'str'
        default: ''
        choices:
          - ''
          - 'http_01'
          - 'dns_01'
        description: 'Selected ACME challenge setup imported by the role, either http_01 or dns_01.'

      certbot_dns_01_credentials_file:
        type: 'str'
        default: ''
        description: 'Host path to the provider credentials file mounted read-only at /run/secrets/certbot-dns-credentials.'

      certbot_dns_01_args:
        type: 'list'
        elements: 'str'
        default: []
        description: 'Provider-specific Certbot argv, including the DNS authenticator and credentials-file option; do not include secret values.'

      certbot_service_name:
        type: 'str'
        default: 'certbot'
        description: 'Base name for the Quadlet certbot unit and matching renewal timer.'

      certbot_certificates:
        type: 'list'
        elements: 'dict'
        default: []
        description: 'Certificate objects managed by the certificates task entrypoint.'

      certbot_timer_enabled:
        type: 'bool'
        default: true
        description: 'Whether the certbot renewal timer should be enabled and started.'

      certbot_timer_on_calendar:
        type: 'str'
        default: 'daily'
        description: 'OnCalendar expression used by the certbot renewal timer.'

      certbot_timer_randomized_delay_sec:
        type: 'str'
        default: '1h'
        description: 'Randomized delay applied to the certbot renewal timer.'

      certbot_timer_persistent:
        type: 'bool'
        default: true
        description: 'Whether missed timer runs should be triggered after downtime.'

      certbot_reload_service_name:
        type: 'str'
        default: 'nginx.service'
        description: 'Optional systemd service reloaded after successful certbot execution via an OnSuccess hook.'

      nginx_container_gid:
        type: 'int'
        description: 'Optional GID granted read access to certificate files for a dependent nginx container.'

  certificates:
    short_description: 'Issues and updates certificates from structured certificate objects.'
    options:
      certbot_email:
        type: 'str'
        default: ''
        description: 'Contact email to be used for certificate registration and certificate issuance.'

      certbot_server:
        type: 'str'
        default: ''
        description: 'Optional ACME directory URL used for certificate issuance. When unset, certbot uses its own default server selection.'

      certbot_key_type:
        type: 'str'
        default: 'ecdsa'
        description: 'Default key type to use for certificate requests unless overridden per certificate.'

      certbot_image_repo:
        type: 'str'
        default: 'docker.io/certbot/certbot'
        description: 'Container image repository used for certificate issuance; DNS-01 requires an image that includes the selected provider plugin.'

      certbot_image_ref:
        type: 'str'
        default: 'latest'
        description: 'Container image version used for certificate issuance runs.'

      certbot_challenge_type:
        type: 'str'
        default: ''
        choices:
          - ''
          - 'http_01'
          - 'dns_01'
        description: 'Selected ACME challenge setup imported by the role, either http_01 or dns_01.'

      certbot_dns_01_credentials_file:
        type: 'str'
        default: ''
        description: 'Host path to the provider credentials file mounted read-only at /run/secrets/certbot-dns-credentials.'

      certbot_dns_01_args:
        type: 'list'
        elements: 'str'
        default: []
        description: 'Provider-specific Certbot argv, including the DNS authenticator and credentials-file option; do not include secret values.'

      certbot_service_name:
        type: 'str'
        default: 'certbot'
        description: 'Base name used when generating temporary issuance container names.'

      certbot_certificates:
        type: 'list'
        elements: 'dict'
        default: []
        description: 'Certificate objects with a certificate name and domains list.'

      nginx_container_gid:
        type: 'int'
        description: 'Optional GID granted read access to certificate files for a dependent nginx container.'

  http_01:
    short_description: 'Prepares shared filesystem paths for HTTP-01 webroot challenges.'
    options:
      certbot_http_01_webroot:
        type: 'str'
        default: '/var/www/letsencrypt'
        description: 'Webroot directory that an HTTP server should expose for ACME HTTP-01 challenges.'

  dns_01:
    short_description: 'Mounts provider credentials for DNS-01 certificate challenges.'
    options:
      certbot_dns_01_credentials_file:
        type: 'str'
        required: true
        description: 'Host path to the provider credentials file mounted read-only at /run/secrets/certbot-dns-credentials.'

      certbot_dns_01_args:
        type: 'list'
        elements: 'str'
        required: true
        description: 'Provider-specific Certbot argv, including the DNS authenticator and credentials-file option; do not include secret values.'
