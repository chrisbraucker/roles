---
certbot_email: ''
certbot_server: ''
certbot_key_type: 'ecdsa'
certbot_image_repo: 'docker.io/certbot/certbot'
certbot_image_ref: 'latest'
certbot_challenge_type: ''
certbot_service_name: 'certbot'
certbot_certificates: []
certbot_timer_enabled: true
certbot_timer_on_calendar: 'daily'
certbot_timer_randomized_delay_sec: '1h'
certbot_timer_persistent: true

certbot_config_dir: '/etc/letsencrypt'
certbot_work_dir: '/var/lib/letsencrypt'
certbot_logs_dir: '/var/log/letsencrypt'

certbot_reload_service_name: 'nginx.service'

certbot_http_01_webroot: '/var/www/letsencrypt'
