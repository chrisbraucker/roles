---
- name: 'Ensure quadlet unit directory exists'
  ansible.builtin.file:
    path: '{{ quadlet_unit_dir }}'
    state: 'directory'
    mode: '0755'


- name: 'Validate quadlet network definitions'
  ansible.builtin.assert:
    that:
      - 'item.name is defined'
    fail_msg: 'Each quadlet network must define name'
  loop: '{{ quadlet_networks }}'
  loop_control:
    label: '{{ item.name | default("<missing name>") }}'


- name: 'Validate quadlet service definitions'
  ansible.builtin.assert:
    that:
      - 'item.name is defined'
      - 'item.image is defined'
    fail_msg: 'Each quadlet service must define name and image'
  loop: '{{ quadlet_services }}'
  loop_control:
    label: '{{ item.name | default("<missing name>") }}'


- name: 'Render quadlet network units'
  ansible.builtin.template:
    src: 'network.network.j2'
    dest: '{{ quadlet_unit_dir }}/{{ item.name }}.network'
    owner: 'root'
    group: 'root'
    mode: '0644'
  loop: '{{ quadlet_networks }}'
  loop_control:
    label: '{{ item.name }}'
  notify: 'Reload systemd for quadlet units'


- name: 'Render quadlet container units'
  ansible.builtin.template:
    src: 'container.container.j2'
    dest: '{{ quadlet_unit_dir }}/{{ item.name }}.container'
    owner: 'root'
    group: 'root'
    mode: '0644'
  loop: '{{ quadlet_services }}'
  loop_control:
    label: '{{ item.name }}'
  notify: 'Reload systemd for quadlet units'


- name: 'Flush quadlet handlers'
  ansible.builtin.meta: flush_handlers


- name: 'Enable and start quadlet network services'
  ansible.builtin.systemd_service:
    name: '{{ item.name }}-network.service'
    state: '{{ (item.state if item.state is defined else none) | default_if_none_or_empty(quadlet_network_default_state) }}'
    enabled: >-
      {{
        quadlet_default_enable
        if (item.enable is not defined or item.enable is none)
        else item.enable
      }}
  loop: '{{ quadlet_networks }}'
  loop_control:
    label: '{{ item.name }}'


- name: 'Enable and start quadlet services'
  ansible.builtin.systemd_service:
    name: '{{ item.name }}.service'
    state: '{{ (item.state if item.state is defined else none) | default_if_none_or_empty(quadlet_default_state) }}'
    enabled: >-
      {{
        quadlet_default_enable
        if (item.enable is not defined or item.enable is none)
        else item.enable
      }}
  loop: '{{ quadlet_services }}'
  loop_control:
    label: '{{ item.name }}'
