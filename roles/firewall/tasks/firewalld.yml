---
- name: 'Install firewalld'
  ansible.builtin.package:
    name:
      - 'firewalld'
    state: 'latest'


- name: 'Remove ufw on apt-based hosts'
  ansible.builtin.package:
    name:
      - 'ufw'
    state: 'absent'


# see https://bugzilla.redhat.com/show_bug.cgi?id=1729287#c3 for reasoning
- name: '[FIX] Add sysctl to initramfs to satisfy firewalld module loading in systemd-modules-load.service'
  ansible.builtin.copy:
    src: 'dracut-99-sysctl.conf'
    dest: '/etc/dracut.conf.d/99-sysctl.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'
    seuser: 'system_u'
    setype: 'etc_t'
  notify: 'Regenerate initramfs'
  when: 'ansible_facts["os_family"] == "RedHat"'


- name: 'Enable and start firewalld'
  ansible.builtin.systemd_service:
    name: 'firewalld.service'
    enabled: true
    state: 'started'


- name: 'Enable DHCP6 client in firewalld'
  ansible.posix.firewalld:
    service: 'dhcpv6-client'
    state: 'enabled'
    zone: '{{ firewall_zone }}'
    permanent: true
    immediate: true
  when:
    - 'firewall_enable_dhcpv6_client | bool'
    - 'ansible_facts["os_family"] == "RedHat"'


- name: 'Manage firewalld ingress ports'
  ansible.posix.firewalld:
    zone: '{{ item.zone | default(firewall_zone) }}'
    port: '{{ item.port }}/{{ item.proto }}'
    state: 'enabled'
    permanent: true
    immediate: true
  loop: '{{ firewall_open_ports }}'
  loop_control:
    label: '{{ item.port }}/{{ item.proto }}'


- name: 'Manage firewalld forward-port rules'
  ansible.posix.firewalld:
    zone: '{{ item.zone | default(firewall_zone) }}'
    port_forward:
      - port: '{{ item.port }}'
        proto: '{{ item.proto }}'
        toport: '{{ item.to_port }}'
        toaddr: '{{ item.to_addr }}'
    state: 'enabled'
    permanent: true
    immediate: true
  loop: '{{ firewall_port_forwards }}'
  loop_control:
    label: '{{ item.port }}/{{ item.proto }} -> {{ item.to_addr }}:{{ item.to_port }}'
