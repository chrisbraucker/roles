---
argument_specs:
  main:
    short_description: 'Installs and manages the host firewall baseline and forward-port rules.'
    options:
      firewall_backend:
        type: 'str'
        default: 'firewalld'
        choices:
          - 'firewalld'
        description: 'Firewall backend managed by the role.'

      firewall_zone:
        type: 'str'
        default: 'public'
        description: 'Default firewalld zone used for services and forward-port rules.'

      firewall_enable_dhcpv6_client:
        type: 'bool'
        default: true
        description: 'Whether the role should enable the dhcpv6-client service in the selected firewalld zone.'

      firewall_port_forwards:
        type: 'list'
        elements: 'dict'
        default: []
        description: 'Forward-port rules managed through firewalld.'
