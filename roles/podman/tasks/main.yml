---
- name: 'Remove other containerization tech'
  ansible.builtin.package:
    pkg:
      - 'docker'
      - 'docker-client'
      - 'docker-client-latest'
      - 'docker-common'
      - 'docker-latest'
      - 'docker-latest-logrotate'
      - 'docker-engine'
      - 'docker.io'
      - 'containerd'
      - 'runc'
    state: 'absent'


- name: 'Install podman'
  ansible.builtin.package:
    name:
      - 'podman'


- name: 'Enable rootless compat for ping and port binding'
  ansible.builtin.copy:
    src: 'sysctl.d-99-containers.conf'
    dest: '/etc/sysctl.d/99-containers.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'
    seuser: 'system_u'
    setype: 'etc_t'
  notify: 'Reload sysctl settings'


- name: 'Apply SELinux compatibility for affected Podman hosts'
  ansible.builtin.import_tasks: 'selinux_bpf_compat.yml'


- name: 'Set containerization fact'
  ansible.builtin.set_fact:
    podman_containerization: true
    cacheable: true
  tags:
    - 'fact'


- name: 'Prepare host for Quadlet-managed Podman workloads'
  ansible.builtin.import_tasks: 'quadlet.yml'
