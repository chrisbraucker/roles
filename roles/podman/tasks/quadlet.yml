---
- name: 'Ensure default containers service user exists'
  ansible.builtin.user:
    name: '{{ podman_containers_user }}'
    comment: 'Podman service user for user namespacing'
    system: true
    shell: '/usr/sbin/nologin'
    create_home: false


- name: 'Ensure subuid mapping for containers user'
  ansible.builtin.lineinfile:
    path: '/etc/subuid'
    regexp: '^{{ podman_containers_user }}:'
    line: '{{ podman_containers_user }}:{{ podman_subuid_start }}:{{ podman_subuid_count }}'
    owner: 'root'
    group: 'root'
    mode: '0644'
    create: true


- name: 'Ensure subgid mapping for containers user'
  ansible.builtin.lineinfile:
    path: '/etc/subgid'
    regexp: '^{{ podman_containers_user }}:'
    line: '{{ podman_containers_user }}:{{ podman_subgid_start }}:{{ podman_subgid_count }}'
    owner: 'root'
    group: 'root'
    mode: '0644'
    create: true


- name: 'Ensure default containers root exists'
  ansible.builtin.file:
    path: '{{ podman_containers_root }}'
    state: 'directory'
    owner: 'root'
    group: 'root'
    mode: '0755'


- name: 'Ensure Quadlet unit directory exists'
  ansible.builtin.file:
    path: '{{ podman_quadlet_unit_dir }}'
    state: 'directory'
    owner: 'root'
    group: 'root'
    mode: '0755'
