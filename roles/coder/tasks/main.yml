---
- name: 'Validate coder configuration'
  ansible.builtin.assert:
    that:
      - 'coder_base_dir | length > 0'
      - 'coder_config_dir | length > 0'
      - 'coder_cache_dir | length > 0'
      - 'coder_env_file | length > 0'
      - 'coder_quadlet_unit_dir | length > 0'
      - 'coder_container_user | int >= 0'
      - 'coder_container_group | int >= 0'
      - 'coder_image_repo | length > 0'
      - 'coder_image_ref | length > 0'
      - 'coder_service_name | length > 0'
      - 'coder_state in ["reloaded", "restarted", "started", "stopped"]'
      - 'coder_restart | length > 0'
      - 'coder_timeout_start | length > 0'
      - 'coder_timeout_stop | length > 0'
      - 'coder_access_url | length > 0'
      - 'coder_wildcard_access_url is none or coder_wildcard_access_url | length > 0'
      - 'coder_http_address | length > 0'
      - 'coder_pg_connection_url | length > 0'
      - 'coder_provisioner_daemons | int >= 0'
      - 'coder_networks | length > 0'
    fail_msg: >-
      Coder requires explicit access URL, external PostgreSQL connection URL,
      image, service, runtime identity, at least one Quadlet network, and
      Quadlet unit directory.


- name: 'Ensure coder host directories exist'
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: 'directory'
    owner: '{{ item.owner | default(coder_container_user) }}'
    group: '{{ item.group | default(coder_container_group) }}'
    mode: '{{ item.mode | default(coder_config_dir_mode) }}'
  loop:
    - path: '{{ coder_base_dir }}'
      owner: 'root'
      group: 'root'
      mode: '0755'
    - path: '{{ coder_config_dir }}'
      owner: 'root'
      group: 'root'
    - path: '{{ coder_cache_dir }}'
      mode: '{{ coder_cache_dir_mode }}'
  loop_control:
    label: '{{ item.path }}'


- name: 'Render coder environment file'
  ansible.builtin.template:
    src: 'coder.env.j2'
    dest: '{{ coder_env_file }}'
    owner: 'root'
    group: 'root'
    mode: '{{ coder_config_file_mode }}'
  register: 'coder_environment_file'
  no_log: true


- name: 'Render coder Quadlet unit'
  ansible.builtin.template:
    src: 'coder.container.j2'
    dest: '{{ (coder_quadlet_unit_dir, coder_service_name ~ ".container") | path_join }}'
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: 'coder_quadlet_unit'


- name: 'Manage coder service'
  ansible.builtin.systemd_service:
    name: '{{ coder_service_name }}.service'
    enabled: '{{ coder_enable }}'
    state: >-
      {{
        'restarted'
        if (
          (coder_quadlet_unit.changed or coder_environment_file.changed)
          and coder_state in ['started', 'restarted']
        )
        else coder_state
      }}
    daemon_reload: '{{ coder_quadlet_unit.changed }}'
