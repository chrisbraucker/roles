---
- name: 'Validate postgres secret configuration'
  ansible.builtin.assert:
    that:
      - 'postgres_service_name | length > 0'
      - 'postgres_superuser_password_length | int >= 24'
      - 'postgres_secret_name | length > 0'
      - 'postgres_secret_target | length > 0'
      - 'postgres_secret_driver | length > 0'
    fail_msg: >-
      PostgreSQL secret management requires service name and Podman secret
      settings. Password length must be at least 24 characters.


- name: 'Check postgres Podman secret on target host'
  ansible.builtin.command:
    argv:
      - 'podman'
      - 'secret'
      - 'inspect'
      - '{{ postgres_secret_name }}'
  register: 'postgres_secret_inspect'
  changed_when: false
  failed_when: false


- name: 'Check whether postgres quadlet unit exists'
  ansible.builtin.stat:
    path: '/etc/containers/systemd/{{ postgres_service_name }}.container'
  register: 'postgres_quadlet_unit_stat'


- name: 'Require postgres_superuser_password when rotating or reusing an existing secret'
  ansible.builtin.fail:
    msg: >-
      postgres_superuser_password must be set when the Podman secret
      {{ postgres_secret_name }} already exists or when
      postgres_secret_force_recreate is enabled. Provide the password through
      inventory or an Ansible secrets file before rerunning the role.
  when:
    - 'postgres_secret_inspect.rc == 0 or postgres_secret_force_recreate | bool'
    - 'postgres_superuser_password is not defined or postgres_superuser_password | length == 0'


- name: 'Ensure local postgres password archive directory exists for bootstrap generation'
  ansible.builtin.file:
    path: '{{ postgres_local_password_dir }}'
    state: 'directory'
    mode: '0700'
  delegate_to: 'localhost'
  become: false
  when:
    - 'postgres_secret_inspect.rc != 0'
    - 'not postgres_secret_force_recreate | bool'
    - 'postgres_superuser_password is not defined or postgres_superuser_password | length == 0'


- name: 'Use provided postgres superuser password'
  ansible.builtin.set_fact:
    postgres_effective_superuser_password: '{{ postgres_superuser_password }}'
  when: 'postgres_superuser_password is defined and postgres_superuser_password | length > 0'
  no_log: true


- name: 'Generate and archive postgres superuser password for bootstrap'
  ansible.builtin.set_fact:
    postgres_effective_superuser_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          postgres_local_password_file,
          length=postgres_superuser_password_length,
          chars=['ascii_letters', 'digits']
        )
      }}
  when:
    - 'postgres_secret_inspect.rc != 0'
    - 'not postgres_secret_force_recreate | bool'
    - 'postgres_superuser_password is not defined or postgres_superuser_password | length == 0'
  no_log: true


- name: 'Stop postgres service before secret rotation'
  ansible.builtin.systemd:
    name: '{{ postgres_service_name }}.service'
    state: 'stopped'
  when:
    - 'postgres_secret_force_recreate | bool'
    - 'postgres_secret_inspect.rc == 0'
    - 'postgres_quadlet_unit_stat.stat.exists'


- name: 'Remove postgres Podman secret before recreation'
  ansible.builtin.command:
    argv:
      - 'podman'
      - 'secret'
      - 'rm'
      - '{{ postgres_secret_name }}'
  when:
    - 'postgres_secret_force_recreate | bool'
    - 'postgres_secret_inspect.rc == 0'
  no_log: true


- name: 'Create postgres Podman secret when absent or rotated'
  ansible.builtin.command:
    argv:
      - 'podman'
      - 'secret'
      - 'create'
      - '--driver'
      - '{{ postgres_secret_driver }}'
      - '{{ postgres_secret_name }}'
      - '-'
    stdin: '{{ postgres_effective_superuser_password }}'
  when:
    - 'postgres_secret_inspect.rc != 0 or postgres_secret_force_recreate | bool'
  no_log: true


- name: 'Start postgres service after secret rotation'
  ansible.builtin.systemd:
    name: '{{ postgres_service_name }}.service'
    state: 'started'
  when:
    - 'postgres_secret_force_recreate | bool'
    - 'postgres_quadlet_unit_stat.stat.exists'
