---
- name: 'Validate postgres container configuration'
  ansible.builtin.assert:
    that:
      - 'postgres_image_repo | length > 0'
      - 'postgres_image_ref | length > 0'
      - 'postgres_service_name | length > 0'
      - 'postgres_quadlet_unit_dir | length > 0'
      - 'postgres_superuser_name | length > 0'
      - 'postgres_superuser_password_length | int >= 24'
      - 'postgres_secret_name | length > 0'
      - 'postgres_secret_target | length > 0'
      - 'postgres_secret_driver | length > 0'
    fail_msg: >-
      PostgreSQL requires image, service name, superuser name, and Podman
      secret settings. Password length must be at least 24 characters.


- name: 'Ensure postgres host directories exist'
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: 'directory'
    owner: '{{ item.owner | default(postgres_container_user) }}'
    group: '{{ item.group | default(postgres_container_group) }}'
    mode: '{{ item.mode | default(postgres_config_dir_mode) }}'
    recurse: '{{ item.recurse | default(false) }}'
  loop:
    - path: '{{ postgres_base_dir }}'
      owner: 'root'
      group: 'root'
    - path: '{{ postgres_data_dir }}'
      mode: '{{ postgres_data_dir_mode }}'
    - path: '{{ postgres_bootstrap_dir }}'
    - path: '{{ postgres_bootstrap_init_dir }}'
  loop_control:
    label: '{{ item.path }}'


- name: 'Bootstrap postgres data directory when needed'
  ansible.builtin.import_tasks: 'bootstrap.yml'


- name: 'Set postgres folder permissions'
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: 'directory'
    owner: '{{ item.owner | default(postgres_container_user) }}'
    group: '{{ item.group | default(postgres_container_group) }}'
    mode: '{{ item.mode | default(postgres_config_dir_mode) }}'
    recurse: '{{ item.recurse | default(false) }}'
  loop:
    - path: '{{ postgres_base_dir }}'
      owner: 'root'
      group: 'root'
    - path: '{{ postgres_data_dir }}'
      recurse: true
    - path: '{{ postgres_bootstrap_dir }}'
    - path: '{{ postgres_bootstrap_init_dir }}'
  loop_control:
    label: '{{ item.path }}'


- name: 'Render postgres quadlet unit'
  ansible.builtin.template:
    src: 'postgres.container.j2'
    dest: '{{ (postgres_quadlet_unit_dir, postgres_service_name ~ ".container") | path_join }}'
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: 'postgres_quadlet_unit'


- name: 'Manage postgres service'
  ansible.builtin.systemd_service:
    name: '{{ postgres_service_name }}.service'
    enabled: '{{ postgres_enable }}'
    state: '{{ postgres_state }}'
    daemon_reload: '{{ postgres_quadlet_unit.changed }}'


- name: 'Remove stale postgres bootstrap secret after steady-state unit is rendered'
  ansible.builtin.command:
    argv:
      - 'podman'
      - 'secret'
      - 'rm'
      - '{{ postgres_secret_name }}'
  register: 'postgres_stale_secret_remove'
  changed_when: 'postgres_stale_secret_remove.rc == 0'
  failed_when: false
  when:
    - 'not postgres_bootstrap_required | bool'
    - 'postgres_secret_inspect.rc == 0'
  no_log: true


- name: 'Remove stale postgres bootstrap container after steady-state unit is rendered'
  ansible.builtin.command:
    argv:
      - 'podman'
      - 'rm'
      - '--force'
      - '{{ postgres_bootstrap_container_name }}'
  register: 'postgres_stale_bootstrap_container_remove'
  changed_when: 'postgres_stale_bootstrap_container_remove.rc == 0'
  failed_when: false
  when: 'not postgres_bootstrap_required | bool'
  no_log: true
