---
- name: 'Validate postgres database configuration'
  ansible.builtin.assert:
    that:
      - 'postgres_service_name | length > 0'
      - 'postgres_container_name | length > 0'
      - 'postgres_superuser_name | length > 0'
      - 'postgres_database_wait_retries | int > 0'
      - 'postgres_database_wait_delay | int > 0'
      - 'postgres_state in ["started", "restarted"]'
      - 'item.name is defined'
      - 'item.name is match("^[a-z_][a-z0-9_]*$")'
      - '(item.owner | default(item.name)) is match("^[a-z_][a-z0-9_]*$")'
      - 'item.password is defined'
      - 'item.password | length > 0'
    fail_msg: >-
      Managed PostgreSQL databases require a lower-case SQL identifier for the
      database name, a lower-case SQL identifier for the owner, a non-empty owner
      password, and a running PostgreSQL service.
  loop: '{{ postgres_databases }}'
  loop_control:
    label: '{{ item.name | default("unnamed") }}'
  no_log: true


- name: 'Wait for postgres to accept local connections'
  ansible.builtin.command:
    argv:
      - 'podman'
      - 'exec'
      - '{{ postgres_container_name }}'
      - 'pg_isready'
      - '-U'
      - '{{ postgres_superuser_name }}'
  register: 'postgres_database_ready'
  changed_when: false
  until: 'postgres_database_ready.rc == 0'
  retries: '{{ postgres_database_wait_retries }}'
  delay: '{{ postgres_database_wait_delay }}'


- name: 'Ensure postgres database owner roles exist'
  ansible.builtin.command:
    argv:
      - 'podman'
      - 'exec'
      - '-i'
      - '{{ postgres_container_name }}'
      - 'psql'
      - '-v'
      - 'ON_ERROR_STOP=1'
      - '-U'
      - '{{ postgres_superuser_name }}'
      - '-d'
      - 'postgres'
      - '-v'
      - 'postgres_database_owner={{ item.owner | default(item.name) }}'
      - '-v'
      - 'postgres_database_owner_password={{ item.password }}'
    stdin: |
      SELECT format(
        'CREATE ROLE %I LOGIN PASSWORD %L',
        :'postgres_database_owner',
        :'postgres_database_owner_password'
      )
      WHERE NOT EXISTS (
        SELECT 1
        FROM pg_roles
        WHERE rolname = :'postgres_database_owner'
      )
      \gexec
  register: 'postgres_database_owner_role'
  changed_when: '"CREATE ROLE" in postgres_database_owner_role.stdout'
  loop: '{{ postgres_databases }}'
  loop_control:
    label: '{{ item.owner | default(item.name) }}'
  no_log: true


- name: 'Ensure postgres application databases exist'
  ansible.builtin.command:
    argv:
      - 'podman'
      - 'exec'
      - '-i'
      - '{{ postgres_container_name }}'
      - 'psql'
      - '-v'
      - 'ON_ERROR_STOP=1'
      - '-U'
      - '{{ postgres_superuser_name }}'
      - '-d'
      - 'postgres'
      - '-v'
      - 'postgres_database_name={{ item.name }}'
      - '-v'
      - 'postgres_database_owner={{ item.owner | default(item.name) }}'
    stdin: |
      SELECT format(
        'CREATE DATABASE %I OWNER %I',
        :'postgres_database_name',
        :'postgres_database_owner'
      )
      WHERE NOT EXISTS (
        SELECT 1
        FROM pg_database
        WHERE datname = :'postgres_database_name'
      )
      \gexec
  register: 'postgres_application_database'
  changed_when: '"CREATE DATABASE" in postgres_application_database.stdout'
  loop: '{{ postgres_databases }}'
  loop_control:
    label: '{{ item.name }}'
