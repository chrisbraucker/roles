---
argument_specs:
  main:
    short_description: 'Deploys PostgreSQL as a Quadlet-managed container with persistent host storage.'
    options:
      postgres_base_dir:
        type: 'str'
        description: 'Base host directory for PostgreSQL state.'
        default: '/opt/containers/postgres'

      postgres_data_dir:
        type: 'str'
        description: 'Host directory mounted as the PostgreSQL data directory.'
        default: '/opt/containers/postgres/data'

      postgres_config_dir_mode:
        type: 'str'
        description: 'Default mode used for host directories managed by the role.'
        default: '0755'

      postgres_data_dir_mode:
        type: 'str'
        description: 'Mode used for the PostgreSQL data directory.'
        default: '0700'

      postgres_bootstrap_dir:
        type: 'str'
        description: 'Host directory used for bootstrap state and init scripts.'
        default: '/opt/containers/postgres/bootstrap'

      postgres_bootstrap_init_dir:
        type: 'str'
        description: 'Host directory mounted into /docker-entrypoint-initdb.d during bootstrap.'
        default: '/opt/containers/postgres/bootstrap/initdb.d'

      postgres_bootstrap_marker_file:
        type: 'str'
        description: 'Host marker file written by the bootstrap init script when initialization completes.'
        default: '/opt/containers/postgres/bootstrap/complete'

      postgres_quadlet_unit_dir:
        type: 'str'
        description: 'System-level Quadlet unit directory where the PostgreSQL unit is rendered.'
        default: '/etc/containers/systemd'

      postgres_container_user:
        type: 'int'
        description: 'Numeric UID used to own PostgreSQL runtime directories and run the container.'
        default: 70

      postgres_container_group:
        type: 'int'
        description: 'Numeric GID used to own PostgreSQL runtime directories and run the container.'
        default: 70

      postgres_version:
        type: 'int'
        description: 'PostgreSQL major version used to locate the initialized PG_VERSION marker.'
        default: 18

      postgres_image_repo:
        type: 'str'
        description: 'Container image repository used for PostgreSQL.'
        default: 'docker.io/library/postgres'

      postgres_image_ref:
        type: 'str'
        description: 'Container image version used for PostgreSQL.'
        default: '18'

      postgres_service_name:
        type: 'str'
        description: 'Quadlet and systemd service name for the PostgreSQL container.'
        default: 'postgres'

      postgres_container_name:
        type: 'str'
        description: 'Runtime container name generated by Quadlet for the PostgreSQL service.'
        default: 'systemd-postgres'

      postgres_networks:
        type: 'list'
        elements: 'str'
        description: 'Quadlet networks attached to the PostgreSQL container.'
        default: []

      postgres_state:
        type: 'str'
        description: 'Desired systemd service state for the PostgreSQL workload.'
        default: 'restarted'
        choices:
          - 'reloaded'
          - 'restarted'
          - 'started'
          - 'stopped'

      postgres_enable:
        type: 'bool'
        description: 'Whether the PostgreSQL systemd service should be enabled.'
        default: true

      postgres_restart:
        type: 'str'
        description: 'Restart policy passed through to the Quadlet service definition.'
        default: 'on-failure'

      postgres_timeout_start:
        type: 'str'
        description: 'Systemd start timeout used by the PostgreSQL service.'
        default: '60s'

      postgres_timeout_stop:
        type: 'str'
        description: 'Systemd stop timeout used by the PostgreSQL service.'
        default: '30s'

      postgres_superuser_name:
        type: 'str'
        description: 'Initial PostgreSQL superuser name bootstrapped by the image.'
        default: 'postgres'

      postgres_superuser_password_length:
        type: 'int'
        description: 'Length of the generated superuser password when bootstrap generation is used.'
        default: 48

      postgres_superuser_password:
        type: 'str'
        description: >-
          PostgreSQL superuser password supplied explicitly through inventory or
          a secrets file. Used for bootstrap when the data directory is still
          uninitialized.

      postgres_secret_name:
        type: 'str'
        description: 'Podman secret name used to expose the PostgreSQL superuser password.'
        default: 'postgres-superuser-password'

      postgres_secret_target:
        type: 'str'
        description: 'Filename used when mounting the Podman secret into the container.'
        default: 'postgres-superuser-password'

      postgres_secret_driver:
        type: 'str'
        description: 'Podman secret driver used to store the PostgreSQL superuser password on the target host.'
        default: 'file'

      postgres_bootstrap_container_name:
        type: 'str'
        description: 'Temporary container name used for one-shot PostgreSQL bootstrap.'
        default: 'postgres-bootstrap'

      postgres_bootstrap_wait_retries:
        type: 'int'
        description: 'How many times the role polls for the bootstrap completion marker.'
        default: 60

      postgres_bootstrap_wait_delay:
        type: 'int'
        description: 'Delay in seconds between bootstrap completion checks.'
        default: 2

      postgres_bootstrap_marker_script_name:
        type: 'str'
        description: 'Filename of the managed init script that writes the bootstrap completion marker.'
        default: '999-bootstrap-complete.sh'

      postgres_database_wait_retries:
        type: 'int'
        description: 'How many times the role polls for PostgreSQL readiness before managing application databases.'
        default: 60

      postgres_database_wait_delay:
        type: 'int'
        description: 'Delay in seconds between PostgreSQL readiness checks before managing application databases.'
        default: 2

      postgres_databases:
        type: 'list'
        elements: 'dict'
        description: 'Application databases and owner roles managed after the PostgreSQL service is running.'
        default: []
        options:
          name:
            type: 'str'
            required: true
            description: 'Database name to create. Must be a lower-case SQL identifier.'

          owner:
            type: 'str'
            description: 'Owner role to create and assign to the database. Defaults to the database name.'

          password:
            type: 'str'
            required: true
            description: 'Initial password for the owner role. Existing owner role passwords are not rotated.'

      postgres_local_password_dir:
        type: 'str'
        description: 'Control-host directory used to archive the generated PostgreSQL superuser password during bootstrap.'
        default: './out/postgres'

      postgres_local_password_file:
        type: 'str'
        description: 'Control-host file used to archive the generated PostgreSQL superuser password during bootstrap.'

  databases:
    short_description: 'Creates application databases and owner roles in a running PostgreSQL container.'
    options:
      postgres_service_name:
        type: 'str'
        description: 'Quadlet and systemd service name for the running PostgreSQL container.'
        default: 'postgres'

      postgres_container_name:
        type: 'str'
        description: 'Runtime container name used for podman exec calls.'
        default: 'systemd-postgres'

      postgres_superuser_name:
        type: 'str'
        description: 'PostgreSQL superuser used to create application owner roles and databases.'
        default: 'postgres'

      postgres_state:
        type: 'str'
        description: 'Desired systemd service state for the PostgreSQL workload.'
        default: 'restarted'
        choices:
          - 'restarted'
          - 'started'

      postgres_database_wait_retries:
        type: 'int'
        description: 'How many times the taskbook polls for PostgreSQL readiness.'
        default: 60

      postgres_database_wait_delay:
        type: 'int'
        description: 'Delay in seconds between PostgreSQL readiness checks.'
        default: 2

      postgres_databases:
        type: 'list'
        elements: 'dict'
        description: 'Application databases and owner roles to create.'
        default: []
        options:
          name:
            type: 'str'
            required: true
            description: 'Database name to create. Must be a lower-case SQL identifier.'

          owner:
            type: 'str'
            description: 'Owner role to create and assign to the database. Defaults to the database name.'

          password:
            type: 'str'
            required: true
            description: 'Initial password for the owner role. Existing owner role passwords are not rotated.'

  bootstrap:
    short_description: 'Bootstraps the PostgreSQL data directory with a temporary one-shot container when uninitialized.'
    options:
      postgres_service_name:
        type: 'str'
        description: 'Quadlet and systemd service name for the PostgreSQL container.'
        default: 'postgres'

      postgres_version:
        type: 'int'
        description: 'PostgreSQL major version used to locate the initialized PG_VERSION marker.'
        default: 18

      postgres_image_repo:
        type: 'str'
        description: 'Container image repository used for PostgreSQL bootstrap.'
        default: 'docker.io/library/postgres'

      postgres_image_ref:
        type: 'str'
        description: 'Container image version used for PostgreSQL bootstrap.'
        default: '18'

      postgres_data_dir:
        type: 'str'
        description: 'Host directory mounted as the PostgreSQL data directory.'
        default: '/opt/containers/postgres/data'

      postgres_bootstrap_dir:
        type: 'str'
        description: 'Host directory used for bootstrap state and init scripts.'
        default: '/opt/containers/postgres/bootstrap'

      postgres_bootstrap_init_dir:
        type: 'str'
        description: 'Host directory mounted into /docker-entrypoint-initdb.d during bootstrap.'
        default: '/opt/containers/postgres/bootstrap/initdb.d'

      postgres_bootstrap_marker_file:
        type: 'str'
        description: 'Host marker file written by the bootstrap init script when initialization completes.'
        default: '/opt/containers/postgres/bootstrap/complete'

      postgres_superuser_name:
        type: 'str'
        description: 'Initial PostgreSQL superuser name bootstrapped by the image.'
        default: 'postgres'

      postgres_superuser_password_length:
        type: 'int'
        description: 'Length of the generated superuser password when bootstrap generation is used.'
        default: 48

      postgres_superuser_password:
        type: 'str'
        description: >-
          PostgreSQL superuser password supplied explicitly through inventory or
          a secrets file. Used for bootstrap when the data directory is still
          uninitialized.

      postgres_secret_name:
        type: 'str'
        description: 'Podman secret name used to expose the PostgreSQL superuser password.'
        default: 'postgres-superuser-password'

      postgres_secret_target:
        type: 'str'
        description: 'Filename used when mounting the Podman secret into the container.'
        default: 'postgres-superuser-password'

      postgres_secret_driver:
        type: 'str'
        description: 'Podman secret driver used to store the PostgreSQL superuser password on the target host.'
        default: 'file'

      postgres_bootstrap_container_name:
        type: 'str'
        description: 'Temporary container name used for one-shot PostgreSQL bootstrap.'
        default: 'postgres-bootstrap'

      postgres_bootstrap_wait_retries:
        type: 'int'
        description: 'How many times the role polls for the bootstrap completion marker.'
        default: 60

      postgres_bootstrap_wait_delay:
        type: 'int'
        description: 'Delay in seconds between bootstrap completion checks.'
        default: 2

      postgres_bootstrap_marker_script_name:
        type: 'str'
        description: 'Filename of the managed init script that writes the bootstrap completion marker.'
        default: '999-bootstrap-complete.sh'

      postgres_local_password_dir:
        type: 'str'
        description: 'Control-host directory used to archive the generated PostgreSQL superuser password during bootstrap.'
        default: './out/postgres'

      postgres_local_password_file:
        type: 'str'
        description: 'Control-host file used to archive the generated PostgreSQL superuser password during bootstrap.'
