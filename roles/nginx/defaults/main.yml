---
nginx_base_dir: '/srv/nginx'
nginx_config_dir: '{{ (nginx_base_dir, "config") | path_join }}'
nginx_http_config_dir: '{{ (nginx_config_dir, "http.d") | path_join }}'
nginx_stream_config_dir: '{{ (nginx_config_dir, "stream.d") | path_join }}'
nginx_include_config_dir: '{{ (nginx_config_dir, "includes") | path_join }}'
nginx_html_dir: '{{ (nginx_base_dir, "html") | path_join }}'
nginx_cache_dir: '{{ (nginx_base_dir, "cache") | path_join }}'
nginx_mount_letsencrypt: false
nginx_letsencrypt_dir: '/etc/letsencrypt'
nginx_letsencrypt_live_dir: '/etc/letsencrypt/live'
nginx_certbot_http_01_enabled: '{{ certbot_challenge_type | default("") == "http_01" }}'
nginx_certbot_http_01_webroot: '{{ certbot_http_01_webroot | default("/var/www/letsencrypt") }}'

nginx_config_owner: 'root'
nginx_config_group: 'root'
nginx_config_dir_mode: '0755'
nginx_config_file_mode: '0644'
nginx_runtime_uid: 101
nginx_runtime_gid: 101
nginx_container_user: '{{ nginx_runtime_uid }}:{{ nginx_runtime_gid }}'
nginx_worker_user: ''

nginx_image: 'docker.io/library/nginx:mainline'
nginx_service_name: 'nginx'
nginx_container_name:
nginx_state:
nginx_enable:
nginx_restart:
nginx_timeout_start: '30s'
nginx_timeout_stop: '15s'
nginx_publish_ports: []
nginx_networks:
  - 'edge'
nginx_add_capabilities:
  - 'NET_BIND_SERVICE'
nginx_extra_volumes: []
nginx_extra_quadlet_args: []
nginx_env: {}
nginx_env_files: []

nginx_manage_edge_network: true
nginx_static_edge_ip_enabled: false
nginx_static_edge_ip: '10.89.0.2'
nginx_static_edge_mac: ''
nginx_static_edge_mac_prefix: '02:89'
nginx_edge_subnet: '10.89.0.0/24'
nginx_edge_gateway: '10.89.0.1'
nginx_edge_network:
  name: 'edge'
  description: 'Ingress network for reverse proxy workloads'
  network_name: 'edge'
  driver: 'bridge'

nginx_worker_processes: 'auto'
nginx_worker_connections: 256
nginx_keepalive_timeout: '65s'
nginx_client_max_body_size: '10m'
nginx_sendfile: false
nginx_server_tokens: false

nginx_ssl_session_cache: 'shared:SSL:10m'
nginx_ssl_session_timeout: '1h'
nginx_ssl_stapling_enabled: false
nginx_ssl_stapling_verify: true
nginx_ssl_stapling_resolver: []
nginx_ssl_stapling_resolver_valid: ''

nginx_limit_req_status: 429
nginx_limit_req_log_level: 'warn'
nginx_limit_req_zones:
  - name: 'perip_req'
    key: '$binary_remote_addr'
    size: '10m'
    rate: '15r/s'
nginx_limit_conn_status: 429
nginx_limit_conn_log_level: 'warn'
nginx_limit_conn_zones:
  - name: 'perip_conn'
    key: '$binary_remote_addr'
    size: '10m'

nginx_http_site_hsts_default: false
nginx_http_site_hsts_header_value: 'max-age=31536000; includeSubDomains'
nginx_http_site_use_default_limits: true
nginx_http_site_default_limit_req:
  - zone: 'perip_req'
    burst: 30
nginx_http_site_default_limit_conn:
  - zone: 'perip_conn'
    count: 20

nginx_global_https_redirect: false
nginx_global_https_redirect_http_port: 80
nginx_global_https_redirect_http_ipv6: true
nginx_global_https_redirect_limit_req: '{{ nginx_http_site_default_limit_req }}'
nginx_global_https_redirect_limit_conn: '{{ nginx_http_site_default_limit_conn }}'

nginx_http_sites: []
nginx_stream_sites: []
nginx_http_snippets: []
nginx_stream_snippets: []
nginx_include_snippets: []
