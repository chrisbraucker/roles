---
argument_specs:
  main:
    short_description: 'Configures nginx and applies the desired service state.'
    options: &nginx_options
      nginx_base_dir:
        type: 'str'
        default: '/srv/nginx'
        description: 'Base host directory for nginx configuration, content, cache, and certificates.'

      nginx_quadlet_unit_dir:
        type: 'str'
        default: '/etc/containers/systemd'
        description: 'System-level Quadlet unit directory where the nginx unit is rendered.'

      nginx_image_repo:
        type: 'str'
        default: 'docker.io/library/nginx'
        description: 'Container image repository used for the nginx workload.'

      nginx_image_ref:
        type: 'str'
        default: 'mainline'
        description: 'Container image version used for the nginx workload.'

      nginx_memory:
        type: 'str'
        description: 'Optional Podman memory limit rendered as Quadlet Container Memory=.'

      nginx_service_name:
        type: 'str'
        default: 'nginx'
        description: 'Quadlet and systemd service name for the nginx container.'

      nginx_container_uid:
        type: 'int'
        default: 101
        description: 'Numeric UID used to run the nginx container process.'

      nginx_container_gid:
        type: 'int'
        default: 101
        description: 'Numeric GID used to run the nginx container process.'

      nginx_state:
        type: 'str'
        default: 'started'
        description: 'Desired systemd service state for the nginx workload.'
        choices:
          - 'reloaded'
          - 'restarted'
          - 'started'
          - 'stopped'

      nginx_enabled:
        type: 'bool'
        default: true
        description: 'Whether the nginx systemd service should be enabled.'

      nginx_networks:
        type: 'list'
        elements: 'str'
        default:
          - 'edge.network'
        description: 'Quadlet networks attached to the nginx container.'

      nginx_network_aliases:
        type: 'list'
        elements: 'str'
        default: []
        description: 'Optional network aliases applied across all attached networks.'

      nginx_mount_letsencrypt:
        type: 'bool'
        default: false
        description: "Whether the role should mount the host Let's Encrypt tree into the nginx container."

      nginx_letsencrypt_dir:
        type: 'str'
        default: '/etc/letsencrypt'
        description: 'Host path mounted into the nginx container when certbot managed certificates are consumed.'

      nginx_certbot_http_01_enabled:
        type: 'bool'
        default: false
        description: 'Whether nginx should mount and serve the certbot HTTP-01 webroot from the global HTTP server.'

      nginx_certbot_http_01_webroot:
        type: 'str'
        default: '/var/www/letsencrypt'
        description: 'Host and container path used for the certbot HTTP-01 webroot.'

      nginx_ssl_session_cache:
        type: 'str'
        default: 'shared:SSL:10m'
        description: 'Global TLS session cache policy rendered into the nginx http block.'

      nginx_ssl_session_timeout:
        type: 'str'
        default: '1h'
        description: 'Global TLS session reuse timeout rendered into the nginx http block.'

      nginx_ssl_stapling_enabled:
        type: 'bool'
        default: false
        description: 'Whether HTTPS sites should render OCSP stapling directives.'

      nginx_ssl_stapling_verify:
        type: 'bool'
        default: true
        description: 'Whether stapled OCSP responses should be verified when stapling is enabled.'

      nginx_ssl_stapling_resolver:
        type: 'list'
        elements: 'str'
        default: []
        description: 'Resolver servers used for OCSP responder lookups when stapling is enabled.'

      nginx_ssl_stapling_resolver_valid:
        type: 'str'
        default: ''
        description: 'Optional resolver validity window appended to the OCSP resolver configuration.'

      nginx_http_https_proxy_protocol_trusted_addresses:
        type: 'list'
        elements: 'str'
        default:
          - '127.0.0.1'
        description: 'Addresses trusted to supply PROXY protocol headers to HTTPS site listeners.'

      nginx_limit_req_status:
        type: 'int'
        default: 429
        description: 'HTTP status returned when a request rate limit is exceeded.'

      nginx_limit_req_log_level:
        type: 'str'
        default: 'warn'
        description: 'Log level used by nginx when request rate limiting triggers.'

      nginx_limit_req_zones:
        type: 'list'
        elements: 'dict'
        default:
          - name: 'perip_req'
            key: '$binary_remote_addr'
            size: '10m'
            rate: '15r/s'
        description: 'Global request-rate limit zones rendered into the nginx http block.'

      nginx_limit_conn_status:
        type: 'int'
        default: 429
        description: 'HTTP status returned when a connection limit is exceeded.'

      nginx_limit_conn_log_level:
        type: 'str'
        default: 'warn'
        description: 'Log level used by nginx when connection limiting triggers.'

      nginx_limit_conn_zones:
        type: 'list'
        elements: 'dict'
        default:
          - name: 'perip_conn'
            key: '$binary_remote_addr'
            size: '10m'
        description: 'Global connection-limit zones rendered into the nginx http block.'

      nginx_global_https_redirect:
        type: 'bool'
        default: false
        description: 'Whether nginx should render a catch-all HTTP server that redirects to HTTPS.'

      nginx_global_https_redirect_http_port:
        type: 'int'
        default: 80
        description: 'HTTP listen port used by the global HTTPS redirect server.'

      nginx_global_https_redirect_http_ipv6:
        type: 'bool'
        default: true
        description: 'Whether the global HTTPS redirect server should also listen on IPv6.'

      nginx_global_https_redirect_limit_req:
        type: 'list'
        elements: 'dict'
        default:
          - zone: 'perip_req'
            burst: 30
        description: 'Server-level request-rate limits applied to the global HTTP-to-HTTPS redirect server.'

      nginx_global_https_redirect_limit_conn:
        type: 'list'
        elements: 'dict'
        default:
          - zone: 'perip_conn'
            count: 20
        description: 'Server-level connection limits applied to the global HTTP-to-HTTPS redirect server.'

  configure:
    short_description: 'Prepares nginx infrastructure without starting the service.'
    options: *nginx_options

  service:
    short_description: 'Applies the desired nginx service state.'
    options:
      nginx_service_name:
        type: 'str'
        default: 'nginx'
        description: 'Quadlet and systemd service name for the nginx container.'

      nginx_state:
        type: 'str'
        default: 'started'
        description: 'Desired systemd service state for the nginx workload.'
        choices:
          - 'reloaded'
          - 'restarted'
          - 'started'
          - 'stopped'

      nginx_enabled:
        type: 'bool'
        default: true
        description: 'Whether the nginx systemd service should be enabled.'

  http_site:
    short_description: 'Renders nginx HTTP site definitions and related HTTP snippets.'
    options:
      nginx_base_dir:
        type: 'str'
        default: '/srv/nginx'
        description: 'Base host directory for nginx configuration, content, cache, and certificates.'

      nginx_http_sites:
        type: 'list'
        elements: 'dict'
        default: []
        description: 'Structured HTTP server definitions rendered into http.d; proxy backend targets should use fixed IP addresses.'

      nginx_http_https_proxy_protocol_trusted_addresses:
        type: 'list'
        elements: 'str'
        default:
          - '127.0.0.1'
        description: 'Addresses trusted to supply PROXY protocol headers to HTTPS site listeners.'

      nginx_ssl_stapling_enabled:
        type: 'bool'
        default: false
        description: 'Whether HTTPS sites should render OCSP stapling directives.'

      nginx_ssl_stapling_verify:
        type: 'bool'
        default: true
        description: 'Whether stapled OCSP responses should be verified when stapling is enabled.'

      nginx_ssl_stapling_resolver:
        type: 'list'
        elements: 'str'
        default: []
        description: 'Resolver servers used for OCSP responder lookups when stapling is enabled.'

      nginx_ssl_stapling_resolver_valid:
        type: 'str'
        default: ''
        description: 'Optional resolver validity window appended to the OCSP resolver configuration.'

      nginx_http_site_hsts_default:
        type: 'bool'
        default: false
        description: 'Default HSTS enablement for HTTPS HTTP sites.'

      nginx_http_site_hsts_header_value:
        type: 'str'
        default: 'max-age=31536000; includeSubDomains'
        description: 'Default Strict-Transport-Security header value used when a site enables HSTS.'

      nginx_http_site_use_default_limits:
        type: 'bool'
        default: true
        description: 'Whether HTTP sites should apply the role default request and connection limits unless overridden per site.'

      nginx_http_site_default_limit_req:
        type: 'list'
        elements: 'dict'
        default:
          - zone: 'perip_req'
            burst: 30
        description: 'Default server-level request-rate limits applied to HTTP sites when nginx_http_site_use_default_limits is true.'

      nginx_http_site_default_limit_conn:
        type: 'list'
        elements: 'dict'
        default:
          - zone: 'perip_conn'
            count: 20
        description: 'Default server-level connection limits applied to HTTP sites when nginx_http_site_use_default_limits is true.'

      nginx_mount_letsencrypt:
        type: 'bool'
        default: false
        description: 'Whether nginx is allowed to consume certbot managed certificates via tls_certificate_name.'

      nginx_letsencrypt_live_dir:
        type: 'str'
        default: '/etc/letsencrypt/live'
        description: 'Container path used to derive fullchain, privkey, and chain paths for tls_certificate_name.'

      nginx_http_snippets:
        type: 'list'
        elements: 'dict'
        default: []
        description: 'Additional raw HTTP config snippets rendered into http.d.'

      nginx_include_snippets:
        type: 'list'
        elements: 'dict'
        default: []
        description: 'Reusable include snippets rendered into includes.'

  stream_site:
    short_description: 'Renders nginx stream proxy definitions and related stream snippets.'
    options:
      nginx_base_dir:
        type: 'str'
        default: '/srv/nginx'
        description: 'Base host directory for nginx configuration, content, cache, and certificates.'

      nginx_stream_sites:
        type: 'list'
        elements: 'dict'
        default: []
        description: 'Structured stream proxy definitions rendered into stream.d; backend targets should use fixed IP addresses.'

      nginx_stream_snippets:
        type: 'list'
        elements: 'dict'
        default: []
        description: 'Additional raw stream config snippets rendered into stream.d.'
