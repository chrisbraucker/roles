---
- name: 'Assemble nginx quadlet volumes'
  ansible.builtin.set_fact:
    nginx_quadlet_volumes: >-
      {{
        nginx_default_volumes
        + (
          [nginx_letsencrypt_dir ~ ':/etc/letsencrypt:Z,ro']
          if nginx_mount_letsencrypt | bool
          else []
        )
        + (
          [nginx_certbot_http_01_webroot ~ ':' ~ nginx_certbot_http_01_webroot ~ ':Z,ro']
          if nginx_certbot_http_01_enabled | bool
          else []
        )
        + nginx_extra_volumes
      }}
  vars:
    nginx_default_volumes:
      - '{{ nginx_config_dir }}:/etc/nginx:Z'
      - '{{ nginx_html_dir }}:/usr/share/nginx/html:Z'
      - '{{ nginx_cache_dir }}:/var/cache/nginx:Z'


- name: 'Ensure nginx host directories exist'
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: 'directory'
    owner: '{{ nginx_config_owner }}'
    group: '{{ nginx_config_group }}'
    mode: '{{ item.mode | default(nginx_config_dir_mode) }}'
  loop:
    - path: '{{ nginx_base_dir }}'
    - path: '{{ nginx_config_dir }}'
    - path: '{{ nginx_http_config_dir }}'
    - path: '{{ nginx_stream_config_dir }}'
    - path: '{{ nginx_include_config_dir }}'
    - path: '{{ nginx_html_dir }}'
    - path: '{{ nginx_cache_dir }}'
    - path: '{{ nginx_letsencrypt_dir }}'
      mode: '0755'
    - path: '{{ nginx_certbot_http_01_webroot }}'
      mode: '0755'
  loop_control:
    label: '{{ item.path }}'
  when: >-
    (
      item.path != nginx_letsencrypt_dir
      or nginx_mount_letsencrypt | bool
    ) and (
      item.path != nginx_certbot_http_01_webroot
      or nginx_certbot_http_01_enabled | bool
    )


- name: 'Render nginx main configuration'
  ansible.builtin.template:
    src: 'nginx.conf.j2'
    dest: '{{ (nginx_config_dir, "nginx.conf") | path_join }}'
    owner: '{{ nginx_config_owner }}'
    group: '{{ nginx_config_group }}'
    mode: '{{ nginx_config_file_mode }}'
  notify: 'Restart nginx'


- name: 'Render global HTTP to HTTPS redirect config'
  ansible.builtin.template:
    src: 'redirect_http_to_https.conf.j2'
    dest: '{{ (nginx_http_config_dir, "00-redirect-http-to-https.conf") | path_join }}'
    owner: '{{ nginx_config_owner }}'
    group: '{{ nginx_config_group }}'
    mode: '{{ nginx_config_file_mode }}'
  when: 'nginx_global_https_redirect | bool'
  notify: 'Restart nginx'


- name: 'Remove global HTTP to HTTPS redirect config when disabled'
  ansible.builtin.file:
    path: '{{ (nginx_http_config_dir, "00-redirect-http-to-https.conf") | path_join }}'
    state: 'absent'
  when: 'not nginx_global_https_redirect | bool'
  notify: 'Restart nginx'


- name: 'Deploy nginx quadlet stack'
  ansible.builtin.include_role:
    name: 'quadlet'
  vars:
    quadlet_networks: >-
      {{
        [
          nginx_edge_network
          | combine(
            {
              'subnets': [nginx_edge_subnet],
              'gateways': [nginx_edge_gateway]
            }
            if nginx_static_edge_ip_enabled | bool
            else {}
          )
        ]
        if nginx_manage_edge_network
        else []
      }}
    quadlet_services:
      - name: '{{ nginx_service_name }}'
        description: 'Nginx reverse proxy'
        image: '{{ nginx_image }}'
        container_name: '{{ nginx_container_name }}'
        restart: '{{ nginx_restart }}'
        timeout_start: '{{ nginx_timeout_start }}'
        timeout_stop: '{{ nginx_timeout_stop }}'
        state: '{{ nginx_state }}'
        enable: '{{ nginx_enable }}'
        ports: '{{ nginx_publish_ports }}'
        networks: >-
          {{
            (
              [nginx_networks[0] ~ ':ip=' ~ nginx_static_edge_ip]
              if (nginx_static_edge_ip_enabled | bool and nginx_networks | length > 0)
              else [nginx_networks[0]]
            )
            + nginx_networks[1:]
          }}
        env: '{{ nginx_env }}'
        env_files: '{{ nginx_env_files }}'
        volumes: '{{ nginx_quadlet_volumes }}'
        health_cmd: 'CMD-SHELL nginx -t'
        health_interval: '30s'
        health_timeout: '5s'
        health_retries: 3
        health_start_period: '10s'
        extra_args: '{{ nginx_extra_quadlet_args }}'


- name: 'Flush nginx handlers'
  ansible.builtin.meta: flush_handlers
