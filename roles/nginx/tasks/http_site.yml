---
- name: 'Validate nginx HTTPS PROXY protocol trust configuration'
  ansible.builtin.assert:
    that:
      - >-
        not (item.listen_https_proxy_protocol | default(false) | bool)
        or (
          nginx_http_https_proxy_protocol_trusted_addresses | length > 0
          and (
            nginx_http_https_proxy_protocol_trusted_addresses
            | reject('equalto', '')
            | list
            | length
          ) == nginx_http_https_proxy_protocol_trusted_addresses | length
        )
      - >-
        not (item.listen_https_proxy_protocol | default(false) | bool)
        or (item.listen_https | default(false) | bool)
      - >-
        not (item.listen_https_proxy_protocol | default(false) | bool)
        or not (item.listen_http | default(false) | bool)
    fail_msg: >-
      HTTPS sites accepting PROXY protocol need at least one trusted proxy
      address and must not share their server block with a direct HTTP listener.
  loop: '{{ nginx_http_sites }}'
  loop_control:
    label: '{{ item.name | default(item.filename | default("<unnamed http site>")) }}'


- name: 'Validate nginx HTTP site definitions'
  ansible.builtin.assert:
    that:
      - 'item.name is defined or item.filename is defined'
      - 'item.server_name is defined'
      - 'item.upstream is defined or item.locations is defined or item.root is defined'
      - >-
        not (item.listen_https | default(false))
        or (
          (item.tls_certificate is defined and item.tls_certificate_key is defined)
          or item.tls_certificate_name is defined
        )
      - >-
        not ((item.listen_https | default(false)) and (item.tls_certificate_name is defined))
        or (nginx_mount_letsencrypt | bool)
      - >-
        not ((item.listen_https | default(false)) and (nginx_ssl_stapling_enabled | bool))
        or (
          (
            item.tls_trusted_certificate is defined
            or item.tls_certificate_chain is defined
            or item.tls_certificate_name is defined
          )
          and (nginx_ssl_stapling_resolver | length > 0)
        )
    fail_msg: >-
      Each nginx HTTP site needs a name or filename, server_name, and either
      upstream, locations, or root. HTTPS listeners also need certificate
      paths or a tls_certificate_name. Sites that reference certbot managed
      certificates require nginx_mount_letsencrypt. If OCSP stapling is
      enabled, a trusted certificate chain path or tls_certificate_name and a
      resolver are also required.
  loop: '{{ nginx_http_sites }}'
  loop_control:
    label: '{{ item.name | default(item.filename | default("<unnamed http site>")) }}'


- name: 'Ensure nginx HTTP config directories exist'
  ansible.builtin.file:
    path: '{{ item }}'
    state: 'directory'
    owner: '{{ nginx_config_owner }}'
    group: '{{ nginx_config_group }}'
    mode: '{{ nginx_config_dir_mode }}'
  loop:
    - '{{ nginx_config_dir }}'
    - '{{ nginx_http_config_dir }}'
    - '{{ nginx_include_config_dir }}'

- name: 'Render nginx include snippets'
  ansible.builtin.copy:
    content: '{{ item.content }}'
    dest: '{{ (nginx_include_config_dir, item.filename) | path_join }}'
    owner: '{{ nginx_config_owner }}'
    group: '{{ nginx_config_group }}'
    mode: '{{ nginx_config_file_mode }}'
  loop: '{{ nginx_include_snippets }}'
  loop_control:
    label: '{{ item.filename }}'
  notify: 'Restart nginx'


- name: 'Render nginx HTTP snippets'
  ansible.builtin.copy:
    content: '{{ item.content }}'
    dest: '{{ (nginx_http_config_dir, item.filename) | path_join }}'
    owner: '{{ nginx_config_owner }}'
    group: '{{ nginx_config_group }}'
    mode: '{{ nginx_config_file_mode }}'
  loop: '{{ nginx_http_snippets }}'
  loop_control:
    label: '{{ item.filename }}'
  notify: 'Restart nginx'


- name: 'Render nginx HTTP site configs'
  ansible.builtin.template:
    src: 'http_site.conf.j2'
    dest: '{{ (nginx_http_config_dir, ((item.filename | default(item.name)) ~ ".conf")) | path_join }}'
    owner: '{{ nginx_config_owner }}'
    group: '{{ nginx_config_group }}'
    mode: '{{ nginx_config_file_mode }}'
  loop: '{{ nginx_http_sites }}'
  loop_control:
    label: '{{ item.name | default(item.filename | default("<unnamed http site>")) }}'
  notify: 'Restart nginx'
