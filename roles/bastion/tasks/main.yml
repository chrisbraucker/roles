---
- name: 'Copy sshrc'
  ansible.builtin.template:
    src: 'sshrc.j2'
    dest: '/etc/ssh/sshrc'
    owner: 'root'
    group: 'root'
    mode: '0644'
    seuser: 'system_u'
    setype: 'etc_t'
  when:
    - '(bastion_sshrc_token | length) > 0'
    - '(bastion_sshrc_chatid | length) > 0'
  tags:
    - 'sshrc'


- name: 'Remove sshrc when notifications are not configured'
  ansible.builtin.file:
    path: '/etc/ssh/sshrc'
    state: 'absent'
  when:
    - '(bastion_sshrc_token | length) == 0 or (bastion_sshrc_chatid | length) == 0'
  tags:
    - 'sshrc'


- name: 'Manage secondary SSH port'
  ansible.builtin.import_tasks: 'ssh_port.yml'
