---
- name: 'Update existing packages'
  ansible.builtin.dnf:
    pkg: '*'
    state: 'latest'
  tags:
    - 'upgrade'


- name: 'Run distro-dependent setup'
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] | lower }}.yml"


- name: 'Create GPG cache'
  ansible.builtin.file:
    dest: '{{ common_gpg_cache_dir }}'
    state: 'directory'
    owner: 'root'
    group: 'root'
    mode: '0755'
    seuser: 'system_u'
    setype: 'var_t'
