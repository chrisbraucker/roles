---
argument_specs:
  main:
    short_description: 'Applies common host baseline configuration.'
    options:
      common_ssh_authorized_keys:
        type: 'list'
        elements: 'str'
        default: []
        description:
          - 'Exclusive SSH public key set for the management user when non-empty.'
          - 'If empty, the authorized_keys file is left untouched.'

      common_management_user:
        type: 'str'
        default: 'mgmt'
        description: 'Management user that receives SSH access and baseline group membership.'

      common_ssh_allow_group:
        type: 'str'
        default: 'ssh'
        description: 'SSH allow-group rendered into the managed sshd drop-in.'

      common_timezone:
        type: 'str'
        default: 'UTC'
        description: 'System timezone applied by the role.'

      common_journald_manage:
        type: 'bool'
        default: false
        description: 'Whether the role should manage a journald drop-in.'

      common_journald_storage:
        type: 'str'
        default: 'volatile'
        description: 'Storage mode written to the journald drop-in when management is enabled.'

      common_journald_runtime_max_use:
        type: 'str'
        default: ''
        description: 'Optional RuntimeMaxUse limit for volatile journald storage.'

      common_journald_system_max_use:
        type: 'str'
        default: ''
        description: 'Optional SystemMaxUse limit for persistent journald storage.'

  gpg_keys:
    short_description: 'Downloads and trusts repository GPG keys for rpm and enabled dnf repos.'
    options:
      gpg:
        type: 'dict'
        required: true
        description: 'GPG key definition consumed by the helper task.'
        options:
          url:
            type: 'str'
            required: true
            description: 'Source URL for the key file.'

          file:
            type: 'str'
            required: true
            description: 'Filename used when caching the downloaded key locally.'

          checksum:
            type: 'str'
            required: true
            description: 'Checksum passed to get_url for key verification.'

          fingerprint:
            type: 'str'
            required: true
            description: 'Expected GPG fingerprint imported into rpm and dnf trust stores.'

      common_repo_match:
        type: 'str'
        required: true
        description: 'DNF repository glob used to discover enabled repo cache directories.'

      common_gpg_cache_dir:
        type: 'str'
        default: '/var/cache/gpg'
        description: 'Cache directory used to store downloaded key material.'
